name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # Stage 1: Automated Testing & Linting (CI)
  # ============================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test-secret-key-ci-pipeline-0123456789"
          ENCRYPTION_KEY: "Jr364QnDUZYS3xYw4sjVGB_J0a0xHXCx8F6f99R-5UU="
        run: |
          PYTHONPATH=. pytest -v tests/

  # ============================================================================
  # Stage 2: Docker Image Build & Validation
  # ============================================================================
  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: simple-fastapi-api:latest

  # ============================================================================
  # Stage 3: Continuous Deployment (CD to Live Render Hosting)
  # ============================================================================
  deploy:
    name: Trigger Live Deployment on Render
    needs: [test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning title=Render Deploy Hook Missing::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository settings. Set this secret under Settings -> Secrets and variables -> Actions to automate live deploys."
            echo "Skipping Render webhook trigger."
          else
            echo "🚀 Triggering live deployment webhook on Render..."
            HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered! (HTTP $HTTP_CODE)"
              echo "Response: $HTTP_BODY"
            else
              echo "❌ Render deployment failed with HTTP $HTTP_CODE"
              echo "Response: $HTTP_BODY"
              exit 1
            fi
          fi
